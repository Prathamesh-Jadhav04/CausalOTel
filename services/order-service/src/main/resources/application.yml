server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:${LOCALAPPDATA}/CausalOTel/data/order.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        foreign_keys: "true"
        busy_timeout: "5000"
        synchronous: "NORMAL"
        temp_store: "MEMORY"
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
  # Spring Boot 4 OTLP tracing properties. The legacy
  # management.otlp.tracing.* keys are not bound by the new starter.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          transport: http
