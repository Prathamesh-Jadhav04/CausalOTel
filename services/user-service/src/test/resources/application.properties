# Test-only fallback. Tests must never use %LOCALAPPDATA%\CausalOTel\data.
# The @DynamicPropertySource in each test class overrides this with a per-run temp database.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/causalotel-test-user-${random.uuid}.db
# Keep the one-time bootstrap token file out of the real application-data tree.
causalotel.bootstrap.security-dir=${java.io.tmpdir}/causalotel-test-security
# H-15: tests must never export telemetry to the live collector.
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
