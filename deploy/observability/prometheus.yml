global: { scrape_interval: 15s, evaluation_interval: 15s }
scrape_configs:
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [user-service:8081] }]
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [product-service:8082] }]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [order-service:8083] }]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [payment-service:8084] }]
  - job_name: inventory-service
    metrics_path: /metrics
    static_configs: [{ targets: [inventory-service:5050] }]
  - job_name: analysis-engine
    metrics_path: /metrics
    static_configs: [{ targets: [analysis-engine:5000] }]
