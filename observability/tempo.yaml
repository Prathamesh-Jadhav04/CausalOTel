# Grafana Tempo Configuration for CausalOTel
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4320"

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  flush_check_period: 10s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: C:/Users/prath/AppData/Local/CausalOTel/tempo-data
    wal:
      path: C:/Users/prath/AppData/Local/CausalOTel/tempo-wal
