# Grafana Tempo 3.x Configuration for CausalOTel.
# __DATA_ROOT__ is rendered by scripts/start-observability.ps1 from
# CAUSALOTEL_DATA_ROOT (default: %LOCALAPPDATA%\CausalOTel). No user-specific
# absolute path is committed to the repository.
#
# Tempo 3.x folds the former ingester/compactor roles into the single binary's
# live-store and block-builder components; only server, distributor, and
# storage are required here.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4320"

storage:
  trace:
    backend: local
    local:
      path: __DATA_ROOT__/observability/tempo-data
    wal:
      path: __DATA_ROOT__/observability/tempo-wal

usage_report:
  reporting_enabled: false
