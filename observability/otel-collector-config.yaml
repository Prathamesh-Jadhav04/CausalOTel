# OpenTelemetry Collector Configuration for CausalOTel
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: localhost:4320
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: causalotel

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
